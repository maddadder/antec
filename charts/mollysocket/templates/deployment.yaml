apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mollysocket.fullname" . }}
  labels:
    {{- include "mollysocket.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mollysocket.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mollysocket.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mollysocket.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["mollysocket", "server"]
          env:
          - name: MOLLY_VAPID_PRIVKEY
            valueFrom:
              secretKeyRef:
                name: mollysocket-secret
                key: vapid-privkey
          - name: ALLOWED_UUIDS
            valueFrom:
              secretKeyRef:
                name: mollysocket-allowed-uuids
                key: allowed-uuids
          volumeMounts:
          - name: mollysocket-data
            mountPath: /root
          ports:
            - name: http
              containerPort: 8020
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 8020
          readinessProbe:
            httpGet:
              path: /
              port: 8020
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: mollysocket-data
          persistentVolumeClaim:
            claimName: mollysocket-data-pvc
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
